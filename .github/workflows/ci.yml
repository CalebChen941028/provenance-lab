name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tool layer unit tests
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s evaluation/tests -v
      - name: Cross-carrier sync (D23)
        run: python3 ci/check_sync.py
      - name: Installer lint
        run: shellcheck install.sh
      - name: Workflow type-check
        working-directory: ci
        run: npm ci && node typecheck.mjs
      - name: Mock run without tools (every gate must fall back)
        run: |
          node ci/mock-run.mjs --no-tools
          node ci/mock-run.mjs --no-tools --handoff-drift
          node ci/mock-run.mjs --no-tools --handoff-late-drift
          node ci/mock-run.mjs --no-tools --handoff-missing
          node ci/mock-run.mjs --no-tools --handoff-reformat
          node ci/mock-run.mjs --no-tools --slow-archive
          node ci/mock-run.mjs --no-tools --archive-timeout
          node ci/mock-run.mjs --no-tools --tool-exception
          node ci/mock-run.mjs --no-tools --annotated-paths
          node ci/mock-run.mjs --no-tools --literal-path
          node ci/mock-run.mjs --no-tools --missing-sap
          node ci/mock-run.mjs --no-tools --annotated-doi
          node ci/mock-run.mjs --no-tools --pipe-doi
          node ci/mock-run.mjs --no-tools --first-correction
          node ci/mock-run.mjs --no-tools --partial-correction
          node ci/mock-run.mjs --no-tools --partial-correction-unknown
          node ci/mock-run.mjs --no-tools --partial-correction-conflict
          node ci/mock-run.mjs --no-tools --large-tool-output
          node ci/mock-run.mjs --no-tools --audit-file
          node ci/mock-run.mjs --no-tools --audit-file-flat
          node ci/mock-run.mjs --no-tools --audit-file-flat-mixed
          node ci/mock-run.mjs --no-tools --audit-file-flat-invalid
          node ci/mock-run.mjs --no-tools --audit-inline-reference
          node ci/mock-run.mjs --no-tools --figure-source-error
          node ci/mock-run.mjs --no-tools --figure-source-persistent
          node ci/mock-run.mjs --no-tools --figure-source-shape
          node ci/mock-run.mjs --no-tools --figure-source-late
          node ci/mock-run.mjs --no-tools --audit-file-missing
          node ci/mock-run.mjs --no-tools --audit-file-malformed
          node ci/mock-run.mjs --no-tools --audit-file-shape
          node ci/mock-run.mjs --no-tools --audit-file-null-item
          node ci/mock-run.mjs --no-tools --audit-bibliography
          node ci/mock-run.mjs --no-tools --audit-bibliography-unconfirmed
          node ci/mock-run.mjs --no-tools --audit-bibliography-hard
          node ci/mock-run.mjs --no-tools --stats-summary-errors
          node ci/mock-run.mjs --no-tools --stats-summary-persistent
          node ci/mock-run.mjs --no-tools --stats-contradictory
          node ci/mock-run.mjs --no-tools --stats-persistent-major
          node ci/mock-run.mjs --no-tools --grill-context
          node ci/mock-run.mjs --no-tools --gate-ambiguous-id
          node ci/mock-run.mjs --no-tools --figure-target-override
          node ci/mock-run.mjs --no-tools --gate-same-id-error
          node ci/mock-run.mjs --no-tools --gate-final-new-error
          node ci/mock-run.mjs --no-tools --gate-persistent-error
          node ci/mock-run.mjs --no-tools --gate-recheck-invalid
          node ci/mock-run.mjs --no-tools --gate-recheck-duplicate
          node ci/mock-run.mjs --no-tools --gate-recheck-null
          node ci/mock-run.mjs --no-tools --gate-recheck-mixed
          node ci/mock-run.mjs --no-tools --gate-recheck-null-check
          node ci/mock-run.mjs --no-tools --analysis-file-path
          node ci/mock-run.mjs --no-tools --gate-drop-entry
          node ci/mock-run.mjs --no-tools --verify-after-portability
          node ci/mock-run.mjs --no-tools --visual-recheck-pass
          node ci/mock-run.mjs --no-tools --stale-recheck
          node ci/mock-run.mjs --no-tools --audit-recheck-errors
          node ci/mock-run.mjs --no-tools --audit-recheck-invalid
          node ci/mock-run.mjs --no-tools --audit-remove

  online:
    # Hits PubMed / Crossref / OpenAlex; an upstream outage should not block merging.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tool layer online tests (API-verified L1 cases)
        run: PLAB_ONLINE=1 python3 -m unittest discover -s tools/tests -v
      - name: Adversarial mock run with real tools
        run: |
          cd ci && npm ci && cd ..
          node ci/mock-run.mjs
          node ci/mock-run.mjs --gate-compound-id
          node ci/mock-run.mjs --gate-compound-missing-id
          node ci/mock-run.mjs --no-stats
          node ci/mock-run.mjs --source-drift
          node ci/mock-run.mjs --audit-swap-source
          node ci/mock-run.mjs --audit-group-reference
          node ci/mock-run.mjs --audit-group-replaced-source
          node ci/mock-run.mjs --gate-remove-hard
          node ci/mock-run.mjs --audit-none-source
          node ci/mock-run.mjs --solo
